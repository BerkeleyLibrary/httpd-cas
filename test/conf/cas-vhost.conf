Mutex file:/var/run/httpd rewrite-map

RewriteEngine On
RewriteMap mapaccess "prg:/usr/local/bin/map-access.py ${MAPS_ROOT}" www-data:www-data
RewriteCond "${mapaccess:$1}" "=Public"
RewriteRule "^/maps/([^/]+)/data/" - [E=MAP_IS_PUBLIC:1]

# Only data files are restricted. Directory listings (and metadata) are always
# public so users can browse a map even when they can't download it.
<LocationMatch "^/maps/[^/]+/data/">
    # mod_dir's index.html subrequest would otherwise trigger the CAS redirect.
    DirectoryIndex disabled
    AuthType CAS
    CASScope /maps
    <RequireAny>
        Require expr -d %{REQUEST_FILENAME}
        Require env MAP_IS_PUBLIC
        Require valid-user
    </RequireAny>
</LocationMatch>

<Location /UCB>
  AuthType CAS
  Require valid-user
</Location>
